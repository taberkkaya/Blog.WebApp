<main class="login-page"><section class="login-story"><a class="public-link" routerLink="/"><i class="fa-solid fa-arrow-left"></i> Siteye dön</a><div class="story-content"><span class="story-mark">CG</span><p class="overline">İÇERİK YÖNETİM SİSTEMİ</p><h1>Bilgiyi yönetin.<br/><em>Etkisini büyütün.</em></h1><p>Blog yazıları, dokümanlar ve site içerikleri için güvenli yönetim alanı.</p></div><div class="story-footer"><span>SAP FI Knowledge Hub</span><span>© 2026</span></div></section><section class="login-panel"><div class="login-box"><div class="mobile-brand">CG</div><span class="eyebrow">Yönetim paneli</span><h2>Tekrar hoş geldiniz</h2><p class="intro">Devam etmek için hesap bilgilerinizi girin.</p><form (ngSubmit)="signIn()"><label>Kullanıcı adı veya e-posta</label><div class="field"><i class="fa-regular fa-user"></i><input [(ngModel)]="model.emailOrUserName" name="user" autocomplete="username" placeholder="Kullanıcı adınız" required/></div><label>Şifre</label><div class="field"><i class="fa-solid fa-lock"></i><input [(ngModel)]="model.password" name="password" type="password" autocomplete="current-password" placeholder="••••••••" required/></div><button class="login-button" type="submit" [disabled]="isLoading">@if(isLoading){<span class="spinner-border spinner-border-sm"></span> Giriş yapılıyor...}@else{Giriş yap <i class="fa-solid fa-arrow-right"></i>}</button></form><p class="secure"><i class="fa-solid fa-shield-halved"></i> Güvenli yönetici oturumu</p></div></section></main>
