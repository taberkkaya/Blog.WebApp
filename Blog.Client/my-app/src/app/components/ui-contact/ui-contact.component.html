<main class="contact-page"><div class="container contact-grid"><section><span class="eyebrow">İletişim</span><h1>{{page.title || 'Birlikte çalışalım.'}}</h1><p>{{page.description}}</p><div class="availability"><span></span> Yeni proje ve danışmanlık taleplerine açık</div></section><aside><p class="aside-label">Bana ulaşın</p><a [href]="'mailto:'+page.email"><span><i class="fa-regular fa-envelope"></i></span><div><small>E-POSTA</small><strong>{{page.email}}</strong></div><i class="fa-solid fa-arrow-up-right-from-square"></i></a><a [href]="'tel:'+page.phoneNumber"><span><i class="fa-solid fa-phone"></i></span><div><small>TELEFON</small><strong>{{page.phoneNumber}}</strong></div><i class="fa-solid fa-arrow-up-right-from-square"></i></a><div class="response-note"><i class="fa-regular fa-clock"></i><p><b>Hızlı geri dönüş</b><br/>Mesajlarınıza mümkün olan en kısa sürede dönüş yapıyorum.</p></div></aside></div></main>
